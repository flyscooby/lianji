<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="练迹">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<title>练迹 · 训练记录</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ============ 顶部栏 ============ -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7v10M20 7v10M7 9v6M17 9v6M7 12h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        </span>
        <span class="brand-text">练迹</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-theme" aria-label="切换主题">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ============ 视图容器 ============ -->
  <main id="view" class="view"></main>

  <!-- ============ 底部导航 ============ -->
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-tab="train">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7v10M20 7v10M7 9v6M17 9v6M7 12h10"/></svg>
      <span>训练</span>
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg>
      <span>数据</span>
    </button>
    <button class="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v3.5M16 3v3.5"/></svg>
      <span>日历</span>
    </button>
    <button class="tab" data-tab="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c1.2-3.8 4-5.6 7.5-5.6s6.3 1.8 7.5 5.6"/></svg>
      <span>我的</span>
    </button>
  </nav>

</div>

<!-- ============ 组间休息倒计时 ============ -->
<div class="rest-overlay" id="rest-overlay" hidden>
  <div class="rest-card">
    <div class="rest-label">组间休息</div>
    <div class="rest-time" id="rest-time">01:30</div>
    <div class="rest-bar"><div class="rest-bar-fill" id="rest-bar-fill"></div></div>
    <div class="rest-actions">
      <button class="btn btn-ghost" id="rest-minus">-15s</button>
      <button class="btn btn-ghost" id="rest-plus">+15s</button>
      <button class="btn btn-accent" id="rest-skip">跳过</button>
    </div>
  </div>
</div>

<!-- ============ 弹层 ============ -->
<div class="sheet-mask" id="sheet-mask" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="src/store.js"></script>
<script src="src/charts.js"></script>
<script src="src/views.js"></script>
<script src="src/app.js"></script>
</body>
</html>
